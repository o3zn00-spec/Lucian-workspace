[package]
name = "lucian-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
